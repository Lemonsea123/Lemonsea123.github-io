<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipment Calibration Info</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 16px;
    background: #f7f8fa;
    color: #333;
  }
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 28px 24px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.08);
  }
  h1 {
    font-size: 20px;
    margin: 0 0 24px;
    text-align: center;
    color: #1d2129;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid #f0f1f3;
    font-size: 15px;
  }
  .row:last-child {
    border-bottom: none;
  }
  .label {
    color: #86909c;
  }
  .value {
    font-weight: 600;
    color: #1d2129;
  }
  .status-valid {
    color: #00b42a;
  }
  .status-expired {
    color: #f53f3f;
  }
  .footer {
    margin-top: 24px;
    text-align: center;
    font-size: 12px;
    color: #c9cdd4;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Equipment Calibration Info</h1>

    <div class="row">
      <span class="label">Model</span>
      <span class="value">XXX-2000</span>
    </div>

    <div class="row">
      <span class="label">Calibration Status</span>
      <span class="value status-valid">Passed</span>
    </div>

    <div class="row">
      <span class="label">Calibration Date</span>
      <span class="value">2026-10-13</span>
    </div>

    <div class="row">
      <span class="label">Valid Until</span>
      <span class="value">2027-10-12</span>
    </div>
  </div>

  <div class="footer">Last updated: 2026-10-13</div>
</body>
</html>
